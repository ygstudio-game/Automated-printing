// Add this to the client script
 
function updateFormForPrinter(printerName) {
    const colorModeSelect = document.getElementById("colorMode");
    const sideSelect = document.getElementById("side");
    const capabilities = printerCapabilities[printerName] || {};
    console.log(capabilities);
    
    // Enable/disable color mode based on printer capability
    if (capabilities.color) {
        colorModeSelect.disabled = false;
        colorModeSelect.parentElement.classList.remove("text-muted");
    } else {
        colorModeSelect.disabled = true;
        colorModeSelect.value = "grayscale";
        colorModeSelect.parentElement.classList.add("text-muted");
    }
    
    // Enable/disable duplex options based on printer capability
    if (capabilities.duplex) {
        sideSelect.disabled = false;
        sideSelect.parentElement.classList.remove("text-muted");
    } else {
        sideSelect.disabled = true;
        sideSelect.value = "simplex";
        sideSelect.parentElement.classList.add("text-muted");
    }
}

// Update form when printer selection changes

            socket.on("printInitiated", async (queueNumber) => {
try {
    const res = await fetch(`/get-request?queueNumber=${queueNumber}`);
    if (!res.ok) throw new Error("Request not found");

    const printRequest = await res.json();
    console.log("✅ printRequest:", printRequest);

    if (!Array.isArray(printRequest.files)) {
        throw new Error("printRequest.files is not an array");
    }

    for (const file of printRequest.files) {
        const response = await fetch("http://localhost:3001/download-and-print", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                downloadLink: file.filePath,
                printer: printRequest.printerSettings.printer,
                colorMode: printRequest.printerSettings.colorMode,
                pages: printRequest.printerSettings.pages,
                copies: printRequest.printerSettings.copies,
                queueNumber,
                totalCost:printRequest.totalCost


            }),
        });
        console.log(printRequest);
        
        const result = await response.json();
        if (!result.success) {
            alert(`❌ Failed to print: ${file.originalName}`);
            return;
        }
    }

    socket.emit("printCompleted", queueNumber);

} catch (err) {
    console.error("❌ Error during printing:", err.message);
}
});

        // Render functions
    function renderRequestCard(request) {

    function renderEditForm(request) {

    // Edit functions
    function editRequest(queueNumber) {
      console.log(3);
      
        editingQueueNumber = queueNumber;
        console.log(currentPrintQueue);
        socket.emit("updateQueue", currentPrintQueue);
    }

    function cancelEdit(queueNumber) {
        editingQueueNumber = null;
        socket.emit("updateQueue", currentPrintQueue);
    }

    function saveEditedRequest(queueNumber) {
        // Get updated values
        const printer = document.getElementById(`edit-printer-${queueNumber}`).value;
        const colorMode = document.getElementById(`edit-colorMode-${queueNumber}`).value;
        const side = document.getElementById(`edit-side-${queueNumber}`).value;
        const orientation = document.getElementById(`edit-orientation-${queueNumber}`).value;
        const scale = document.getElementById(`edit-scale-${queueNumber}`).value;
        const paperSize = document.getElementById(`edit-paperSize-${queueNumber}`).value;
        const pages = document.getElementById(`edit-pages-${queueNumber}`).value;
        const copies = document.getElementById(`edit-copies-${queueNumber}`).value;

        // Find request and update settings
        const request = currentPrintQueue.find(req => req.queueNumber === queueNumber);
        if (request) {
            request.printerSettings = {
                printer,
                colorMode,
                copies,
                pages,
                orientation,
                scale,
                side,
                paperSize
            };
            
            // Emit update to server
            socket.emit("updatePrintRequest", {
                queueNumber: queueNumber,
                printerSettings: request.printerSettings
            });
        }
        
        editingQueueNumber = null;
        socket.emit("updateQueue", currentPrintQueue);
    }
    function removeRequest(queueNumber) {
socket.emit("removeRequest", queueNumber);
}
    // Client file upload handler
    function uploadFiles() {
        const status = document.getElementById("uploadStatus");
        const uploadPrintBtn = document.getElementById("uploadPrintButton");
      status.innerHTML = `<div class="text-info d-flex justify-content-center align-items-center">
        <div class="spinner-border text-info" role="status"></div>
        <span class="ms-2">Uploading...</span>
      </div>`;
       uploadPrintBtn.classList.add("d-none");

        const files = document.getElementById("fileInput").files;
        const printerName = document.getElementById("printerSelect").value;
        const colorMode = document.getElementById("colorMode").value;
        const pages = document.getElementById("pages").value;
        const copies = document.getElementById("copies").value;
        const orientation = document.getElementById("orientation").value;
        const scale = document.getElementById("scale").value;
        const side = document.getElementById("side").value;
        const paperSize = document.getElementById("paperSize").value;
        if (files.length === 0) {
            alert("Please select files.");
            return;
        }

        const formData = new FormData();
        for (let file of files) {
            formData.append("files", file);
        }
        formData.append("printer", printerName);
        formData.append("colorMode", colorMode);
        formData.append("copies", copies);
        formData.append("pages", pages);
        formData.append("orientation", orientation);
        formData.append("scale", scale);
        formData.append("side", side);
        formData.append("paperSize", paperSize);
        fetch("/upload", {
method: "POST",
body: formData,
headers: {
        "x-socket-id": socket.id // Pass the socket ID to the backend
    }
})
.then(res => res.json())
.then(data => {
console.log("Upload Response:", data); // Debugging line

status.innerHTML = `<div class="text-[#50d71e]text-center fadeIn">

      </div>
    </div>` 
})
.catch(err => {

 async function getQueueNumber() {
    try {
      const response = await fetch('http://localhost:3001/next-queue', {
        method: 'GET',
        mode: 'cors',
        headers: {
          'Content-Type': 'application/json'
        }
      });
      
      if (!response.ok) throw new Error('Failed to get queue number');
      return await response.json();
    } catch (error) {
      console.error('Error getting queue number:', error);
      // Fallback: generate timestamp-based number
      return Math.floor(Date.now() / 1000);
    }
  }
